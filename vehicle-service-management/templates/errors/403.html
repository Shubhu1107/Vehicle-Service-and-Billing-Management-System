{% extends "base.html" %}

{% block title %}403 Forbidden | {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card dashboard-card p-5 border-0 shadow-sm">
        <div class="display-1 fw-bold text-danger mb-2">403</div>
        <h4 class="fw-bold mb-2">Access Denied / Forbidden</h4>
        <p class="text-muted small mb-4">
          You do not have administrative or role-level permissions to access this workshop resource.
        </p>
        <div>
          <a href="/" class="btn btn-primary btn-sm px-4">
            <i class="bi bi-house me-1"></i> Return to Safety
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
