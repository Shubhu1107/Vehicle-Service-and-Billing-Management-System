{% extends "base.html" %}

{% block title %}404 Page Not Found | {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card dashboard-card p-5 border-0 shadow-sm">
        <div class="display-1 fw-bold text-primary mb-2">404</div>
        <h4 class="fw-bold mb-2">Page Not Found</h4>
        <p class="text-muted small mb-4">
          The requested service order, page, or vehicle record could not be found or has been moved.
        </p>
        <div>
          <a href="/" class="btn btn-primary btn-sm px-4">
            <i class="bi bi-house me-1"></i> Return to Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
