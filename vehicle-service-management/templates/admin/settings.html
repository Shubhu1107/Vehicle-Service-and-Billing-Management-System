{% extends "base.html" %}

{% block title %}Workshop Settings | {{ app_name }}{% endblock %}
{% block page_title %}Workshop Configuration &amp; Business Profile{% endblock %}

{% block content %}
<div class="container-fluid p-0">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="dashboard-card">
        <div class="card-header">
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-gear text-primary"></i>
            <span>Workshop Profile &amp; Billing Parameters</span>
          </div>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('admin.settings') }}">
            <h6 class="fw-bold text-dark border-bottom pb-2 mb-3">1. Business Profile</h6>
            <div class="row g-3 mb-4">
              <div class="col-12">
                <label class="form-label small fw-semibold">Service Center / Workshop Trade Name <span class="text-danger">*</span></label>
                <input type="text" name="workshop_name" class="form-control" value="{{ settings.workshop_name }}" required>
              </div>

              <div class="col-12">
                <label class="form-label small fw-semibold">Physical Workshop Address <span class="text-danger">*</span></label>
                <textarea name="workshop_address" rows="2" class="form-control" required>{{ settings.workshop_address }}</textarea>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Helpline Phone Number <span class="text-danger">*</span></label>
                <input type="text" name="workshop_phone" class="form-control" value="{{ settings.workshop_phone }}" required>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Support Email Address <span class="text-danger">*</span></label>
                <input type="email" name="workshop_email" class="form-control" value="{{ settings.workshop_email }}" required>
              </div>
            </div>

            <h6 class="fw-bold text-dark border-bottom pb-2 mb-3">2. Invoicing, Taxation &amp; Currency</h6>
            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label small fw-semibold">GSTIN / Tax Identification</label>
                <input type="text" name="workshop_gstin" class="form-control text-uppercase" value="{{ settings.workshop_gstin }}">
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-semibold">Default GST Tax Rate (%) <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input type="number" step="0.01" name="default_tax_rate" class="form-control" value="{{ settings.default_tax_rate }}" required>
                  <span class="input-group-text">%</span>
                </div>
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-semibold">Currency Symbol <span class="text-danger">*</span></label>
                <input type="text" name="currency_symbol" class="form-control" value="{{ settings.currency_symbol }}" required>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
              <button type="submit" class="btn btn-primary btn-sm px-4 shadow-sm">
                <i class="bi bi-save me-1"></i> Save Configuration
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
